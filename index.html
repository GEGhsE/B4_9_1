<!DOCTYPE html>
<!-- © 2026 GEG 화성(깊이 e끌림) · 김수경 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3학년 영어 낱말 여행 🌱</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF9F0;--card:#fff;--apricot:#F6B17A;--apricot-soft:#FFE9D6;--sage:#7FB069;--sage-soft:#E6F0DD;--sky:#8FC1DA;--sky-soft:#E2F0F6;--amber:#E8A33D;--ink:#5A4632;--ink-soft:#9A8A77;--line:#F0E4D4;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);font-family:'Jua','Noto Sans KR',sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none}
[onclick]{cursor:pointer;user-select:none}
.en{letter-spacing:.5px}
#fit{position:fixed;inset:0;overflow:hidden;background:var(--cream);display:flex;justify-content:center}
#stage{width:100%;max-width:1280px;height:100%;background:var(--cream);display:flex;flex-direction:column;overflow:hidden;user-select:none}
input,textarea{user-select:text}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:9px 26px;background:#fff;border-bottom:3px solid var(--apricot-soft);flex-shrink:0}
.brand{font-size:22px;display:flex;gap:6px;align-items:center}
.top-r{display:flex;gap:10px;align-items:center}
.who{font-size:24px;color:var(--ink-soft)}
.seeds{background:#FFF3E2;border:3px solid var(--apricot);border-radius:99px;padding:8px 22px;font-size:25px;color:var(--amber)}
.gear{background:var(--apricot-soft);border-radius:50%;width:50px;height:50px;font-size:24px}
/* progress */
.prog{display:flex;gap:6px;padding:8px 26px;background:#fff;border-bottom:2px solid var(--line);flex-shrink:0}
.dot{flex:1;height:10px;border-radius:99px;background:var(--line)}
.dot.on{background:var(--sage)}
.dot.cur{background:var(--apricot)}
/* main */
main{flex:1;overflow:hidden;padding:16px 34px;display:flex;flex-direction:column}
.h1{font-size:30px;margin-bottom:5px}
.sub{font-size:26px;color:var(--ink-soft);margin-bottom:16px}
.goal{background:var(--sage-soft);border-left:8px solid var(--sage);border-radius:0 14px 14px 0;padding:12px 20px;font-size:24px;margin-bottom:12px}
.center{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.btn{background:var(--sage);color:#fff;border-radius:99px;padding:13px 30px;font-size:26px}
.nav .btn{font-size:23px;padding:11px 26px}
.wnav{display:flex;gap:12px;align-items:center}
.warrow{background:var(--apricot-soft);color:var(--amber);border-radius:99px;width:62px;height:62px;font-size:28px;flex-shrink:0}
.meetcount{font-size:22px;color:var(--ink-soft)}
.spd{background:var(--sky-soft);color:var(--sky);border:3px solid var(--sky-soft);border-radius:99px;padding:8px 16px;font-size:20px;cursor:pointer}
.spd.on{background:var(--sky);color:#fff;border-color:var(--sky)}
.btn.soft{background:var(--apricot-soft);color:var(--amber)}
.btn.sky{background:var(--sky);color:#fff}
.btn:disabled{opacity:.45}
.nav{display:flex;justify-content:space-between;gap:12px;flex-shrink:0;padding-top:12px}
.sbody{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:12px;justify-content:flex-start}
/* start */
.select{font-family:inherit;font-size:34px;padding:16px 26px;border:3px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);min-width:320px;text-align:center;cursor:pointer}
.unitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%}
.unit{background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px 8px;font-size:23px;text-align:center}
.unit.sel{border-color:var(--sage);background:var(--sage-soft)}
/* word grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-content:start;flex:1;min-height:0;overflow:hidden}
.wcard{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.wcard.met{border-color:var(--sage);background:var(--sage-soft)}
.emoji{font-size:64px;line-height:1.05}
.wen{font-size:34px;margin-top:3px}
.wko{font-size:22px;color:var(--ink-soft)}
/* big single card */
.big{background:#fff;border:4px solid var(--apricot);border-radius:28px;width:560px;max-width:90%;padding:28px;text-align:center}
.big .emoji{font-size:82px}
.big .wen{font-size:50px}
.big .wko{font-size:34px;color:var(--ink-soft)}
.reveal{font-size:36px;color:var(--ink-soft);min-height:40px;margin-top:8px}
/* recording */
.recbtn{width:120px;height:120px;border-radius:50%;background:var(--sky);color:#fff;font-size:42px}
.recbtn.rec{background:var(--amber);animation:pulse 1s infinite}
.rec{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.recnote{font-size:24px;color:var(--ink-soft)}
.kbd{font-family:inherit;font-size:26px;padding:12px;border:3px solid var(--line);border-radius:14px;width:520px;max-width:90%;color:var(--ink)}
/* tree */
.tree{font-size:36px;color:var(--sage);text-align:center;line-height:1.5}
.treebig{font-size:88px;line-height:1.2}
.treebox{position:relative;width:148px;height:148px;margin:0 auto 2px}
.treeSvg{width:100%;height:100%;display:block}
.apples{position:absolute;inset:0;pointer-events:none}
.apple{position:absolute;font-size:22px;transform:translate(-50%,-50%)}
.apple.pop{animation:applePop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes applePop{0%{transform:translate(-50%,-50%) scale(0)}60%{transform:translate(-50%,-50%) scale(1.4)}100%{transform:translate(-50%,-50%) scale(1)}}
.treecount{text-align:center;font-size:24px;color:var(--sage);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start}
.wordchip{background:#fff;border:3px solid var(--line);border-radius:99px;padding:11px 22px;font-size:25px;cursor:pointer;color:var(--ink)}
.wordchip.met{background:var(--sage-soft);border-color:var(--sage)}
.writecard{background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 22px;display:flex;align-items:center;gap:16px;justify-content:center;max-width:480px;margin:0 auto}
.writecard .emoji{font-size:60px}
.writecard .wen{font-size:40px}
.writecard .wko{font-size:22px;color:var(--ink-soft)}
.wtext{text-align:left}
.writebtns{display:flex;gap:12px;justify-content:center;margin-top:8px;flex-shrink:0}
.treewrap{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.writecard{flex-shrink:0}
.wdone{color:var(--sage);font-size:24px}
.reveal.pop{animation:revealPop .4s ease}
@keyframes revealPop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
/* reflect */
.stars{display:flex;gap:14px;font-size:66px}
.star{cursor:pointer;color:var(--line)}
.star.on{color:var(--amber)}
.qbox{background:#fff;border:3px solid var(--line);border-radius:18px;padding:18px;width:640px;max-width:92%}
.qbox p{font-size:28px;margin-bottom:10px}
.qbox textarea{width:100%;border:3px solid var(--line);border-radius:14px;padding:12px;font-family:inherit;font-size:26px;resize:none;height:88px;color:var(--ink)}
/* toast / overlay */
.burst{position:fixed;font-size:40px;z-index:70;pointer-events:none;animation:burst 1.4s ease-out forwards}
@keyframes burst{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translateY(-130px) scale(1.2) rotate(18deg);opacity:0}}

.spk{background:var(--sky-soft);color:var(--sky);border-radius:50%;width:50px;height:50px;font-size:24px}
.buddy{display:flex;gap:10px;align-items:flex-start;flex-shrink:0;margin-bottom:6px}
.mascotSvg{width:56px;height:56px;flex-shrink:0}
.bubble{background:#fff;border:3px solid var(--apricot-soft);border-radius:8px 16px 16px 16px;padding:7px 40px 7px 14px;position:relative;display:flex;flex-direction:column;gap:1px}
.ben{font-size:22px;color:var(--ink)}
.bko{font-size:17px;color:var(--ink-soft)}
.bspk{position:absolute;right:6px;top:6px;background:var(--sky-soft);color:var(--sky);border-radius:50%;width:30px;height:30px;font-size:15px}
.moodrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.moodbtn{background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 16px;font-size:56px;cursor:pointer;line-height:1}
.moodbtn.sel{border-color:var(--sage);background:var(--sage-soft)}
.moodlbl{font-size:20px;color:var(--ink-soft);margin-top:4px}
.moodsay{min-height:64px;margin-top:8px;text-align:center}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(90px);background:var(--sage);color:#fff;padding:14px 28px;border-radius:99px;font-size:22px;opacity:0;transition:.3s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.overlay{position:fixed;inset:0;background:rgba(90,70,50,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.overlay.show{display:flex}
.sheet{background:#fff;border-radius:24px;padding:28px;max-width:520px;width:100%}
.sheet h3{font-size:24px;margin-bottom:8px}
.sheet .desc{font-size:17px;color:var(--ink-soft)}
.sheet input{width:100%;border:3px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:18px;margin-top:12px}
.sheet .srow{display:flex;gap:10px;margin-top:18px}
.sheet .srow button{flex:1;border-radius:99px;padding:14px;font-size:20px}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div class="top">
    <div class="brand">🌱 영어 낱말 여행</div>
    <div class="top-r">
      <span class="who" id="who"></span>
      <span class="seeds" id="seeds">씨앗 0</span><button class="spk" id="spk" onclick="toggleSpk()">🔊</button>
    </div>
  </div>
  <div class="prog" id="prog"></div>
  <main id="main"></main>
</div></div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay">
  <div class="sheet">
    <h3>⚙️ 선생님 설정</h3>
    <p class="desc">시트 사본을 만들고 [🌱 영어 낱말 → 📲 앱 연결 안내]에서 받은 배포 주소(/exec)를 붙여넣으면, 우리 반 이름과 녹음·돌아보기가 저장돼요.</p>
    <input id="gasInput" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="srow"><button class="btn soft" onclick="closeSettings()">닫기</button><button class="btn" onclick="saveSettings()">🔗 연결하기</button></div>
    <div id="linkArea" style="display:none;margin-top:16px">
      <p class="desc">학생용 입장 주소 — 학생들에게 공유하세요. 학생은 ⚙️ 없이 이름만 골라 바로 입장해요.</p>
      <input id="linkOut" readonly>
      <button class="btn sky" style="width:100%;margin-top:10px" onclick="copyLink()">📋 학생용 주소 복사</button>
    </div>
    <p class="desc" style="margin-top:14px;text-align:center">개발자 · 김수경</p>
  </div>
</div>

<script>
/* ===== 내장 낱말 (교과서 1~10과). 시트 '낱말'을 채우면 그걸로 대체됨 ===== */
const SVG_FIG=`<svg width="1em" height="1em" viewBox="0 0 64 64" style="vertical-align:middle"><path d="M32 16c-3 0-5 2-6 5-9 2-15 9-15 18 0 11 9 18 21 18s21-7 21-18c0-9-6-16-15-18-1-3-3-5-6-5z" fill="#9B6BC4"/><path d="M32 16c2 0 4 1 5 3-2 1-3 3-3 5h-4c0-2-1-4-3-5 1-2 3-3 5-3z" fill="#7FB069"/><rect x="30" y="9" width="4" height="9" rx="2" fill="#7FB069"/><circle cx="26" cy="41" r="2" fill="#FFE0EC"/><circle cx="34" cy="37" r="2" fill="#FFE0EC"/><circle cx="38" cy="45" r="2" fill="#FFE0EC"/></svg>`;
const SVG_ERASER=`<svg width="1em" height="1em" viewBox="0 0 64 64" style="vertical-align:middle"><rect x="12" y="22" width="40" height="22" rx="6" fill="#F4A7C0"/><path d="M18 22h28a6 6 0 0 1 6 6v3H12v-3a6 6 0 0 1 6-6z" fill="#8FC1DA"/></svg>`;
const SVG_GLUE=`<svg width="1em" height="1em" viewBox="0 0 64 64" style="vertical-align:middle"><rect x="24" y="26" width="16" height="30" rx="3" fill="#F6B17A"/><rect x="24" y="39" width="16" height="7" fill="#fff" opacity=".55"/><rect x="26" y="12" width="12" height="16" rx="2" fill="#7FB069"/><ellipse cx="32" cy="12" rx="6" ry="3" fill="#FFF3E2"/></svg>`;
const SVG_CASE=`<svg width="1em" height="1em" viewBox="0 0 64 64" style="vertical-align:middle"><rect x="10" y="26" width="44" height="22" rx="8" fill="#8FC1DA"/><rect x="10" y="34" width="44" height="14" rx="6" fill="#6FA8C8"/><rect x="20" y="20" width="6" height="10" rx="3" fill="#F6B17A"/><rect x="30" y="18" width="6" height="12" rx="3" fill="#7FB069"/><rect x="40" y="21" width="6" height="9" rx="3" fill="#E8A33D"/></svg>`;
const WORDS={
 "사물":[{en:"bag",ko:"가방",e:"🎒"},{en:"ball",ko:"공",e:"⚽"},{en:"car",ko:"자동차",e:"🚗"},{en:"chair",ko:"의자",e:"🪑"},{en:"clock",ko:"시계",e:"🕐"},{en:"cup",ko:"컵",e:"☕"},{en:"doll",ko:"인형",e:"🧸"},{en:"big",ko:"큰",e:"🔵"},{en:"small",ko:"작은",e:"🔹"}],
 "동작1":[{en:"sit",ko:"앉다",e:"🧎"},{en:"stand",ko:"서다",e:"🧍"},{en:"open",ko:"열다",e:"📂"},{en:"close",ko:"닫다",e:"🚪"},{en:"come",ko:"오다",e:"🙋"},{en:"look",ko:"보다",e:"👀"},{en:"run",ko:"달리다",e:"🏃"},{en:"jump",ko:"뛰다",e:"🤸"}],
 "동작2":[{en:"catch",ko:"잡다",e:"🧤"},{en:"climb",ko:"오르다",e:"🧗"},{en:"dance",ko:"춤추다",e:"💃"},{en:"fly",ko:"날다",e:"🕊️"},{en:"kick",ko:"차다",e:"🦵"},{en:"ski",ko:"스키 타다",e:"⛷️"},{en:"slide",ko:"미끄럼 타다",e:"🛝"},{en:"swim",ko:"수영하다",e:"🏊"}],
 "동물":[{en:"cat",ko:"고양이",e:"🐱"},{en:"cow",ko:"소",e:"🐮"},{en:"dog",ko:"개",e:"🐶"},{en:"duck",ko:"오리",e:"🦆"},{en:"lion",ko:"사자",e:"🦁"},{en:"monkey",ko:"원숭이",e:"🐵"},{en:"pig",ko:"돼지",e:"🐷"},{en:"rabbit",ko:"토끼",e:"🐰"},{en:"zebra",ko:"얼룩말",e:"🦓"}],
 "음식":[{en:"apple",ko:"사과",e:"🍎"},{en:"banana",ko:"바나나",e:"🍌"},{en:"fig",ko:"무화과",e:SVG_FIG},{en:"grapes",ko:"포도",e:"🍇"},{en:"orange",ko:"오렌지",e:"🍊"},{en:"tomato",ko:"토마토",e:"🍅"},{en:"bread",ko:"빵",e:"🍞"},{en:"ice cream",ko:"아이스크림",e:"🍦"},{en:"pizza",ko:"피자",e:"🍕"},{en:"salad",ko:"샐러드",e:"🥗"},{en:"soup",ko:"수프",e:"🍲"}],
 "학용품":[{en:"crayon",ko:"크레용",e:"🖍️"},{en:"eraser",ko:"지우개",e:SVG_ERASER},{en:"glue stick",ko:"풀",e:SVG_GLUE},{en:"notebook",ko:"공책",e:"📓"},{en:"pencil",ko:"연필",e:"✏️"},{en:"pencil case",ko:"필통",e:SVG_CASE},{en:"ruler",ko:"자",e:"📏"},{en:"scissors",ko:"가위",e:"✂️"}],
 "감정":[{en:"happy",ko:"기쁜",e:"😊"},{en:"sad",ko:"슬픈",e:"😢"},{en:"angry",ko:"화난",e:"😠"},{en:"hungry",ko:"배고픈",e:"😋"},{en:"tired",ko:"피곤한",e:"😫"}],
 "색깔":[{en:"red",ko:"빨강",e:"🟥"},{en:"orange",ko:"주황",e:"🟧"},{en:"yellow",ko:"노랑",e:"🟨"},{en:"green",ko:"초록",e:"🟩"},{en:"blue",ko:"파랑",e:"🟦"},{en:"purple",ko:"보라",e:"🟪"},{en:"brown",ko:"갈색",e:"🟫"},{en:"pink",ko:"분홍",e:"🩷"},{en:"white",ko:"하양",e:"⬜"},{en:"color",ko:"색깔",e:"🎨"}],
 "날씨":[{en:"sunny",ko:"맑은",e:"☀️"},{en:"cloudy",ko:"흐린",e:"☁️"},{en:"raining",ko:"비 오는",e:"🌧️"},{en:"snowing",ko:"눈 오는",e:"🌨️"},{en:"windy",ko:"바람 부는",e:"🌬️"},{en:"hot",ko:"더운",e:"🥵"},{en:"cold",ko:"추운",e:"🥶"},{en:"hat",ko:"모자",e:"🎩"},{en:"snowman",ko:"눈사람",e:"⛄"}],
 "수":[{en:"one",ko:"1",e:"1️⃣"},{en:"two",ko:"2",e:"2️⃣"},{en:"three",ko:"3",e:"3️⃣"},{en:"four",ko:"4",e:"4️⃣"},{en:"five",ko:"5",e:"5️⃣"},{en:"six",ko:"6",e:"6️⃣"},{en:"seven",ko:"7",e:"7️⃣"},{en:"eight",ko:"8",e:"8️⃣"},{en:"nine",ko:"9",e:"9️⃣"},{en:"ten",ko:"10",e:"🔟"}]
};
let UNITS=Object.keys(WORDS);

/* ===== 흐름 ===== */
const STEPS=["이름","기분","미션","낱말 만나기","낱말 깜박이","말해보기","녹음하기","공책 시간","돌아보기","오늘의 성장"];
const S={step:0,name:"",unit:UNITS[0],met:{},seeds:0,star:0,reason:"",idx:0,widx:0,mood:""};
let GAS_URL=lsGet("v3_gas")||"";
let isStudent=false;
(function(){var m=(location.hash||"").match(/[#&]c=([^&]+)/);if(m){GAS_URL=decodeURIComponent(m[1]);isStudent=true;}})();
function entryLink(){return location.origin+location.pathname+"#c="+encodeURIComponent(GAS_URL);}
function copyLink(){try{navigator.clipboard.writeText(entryLink());}catch(e){}toast("학생용 주소를 복사했어요");}

/* storage shim (샌드박스 대비) */
const _mem={};
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return _mem[k]||null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){_mem[k]=v;}}

const $=s=>document.querySelector(s);
function words(){return WORDS[S.unit]||[];}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function grow(n,m){S.seeds+=n;$("#seeds").textContent="씨앗 "+S.seeds;if(m)toast(m);}
function celebrate(){var ico=["⭐","💖","🌸","🌟","🎉","💛"];for(var i=0;i<18;i++){(function(j){var s=document.createElement("span");s.className="burst";s.textContent=ico[j%ico.length];s.style.left=(8+Math.random()*84)+"%";s.style.top=(18+Math.random()*44)+"%";s.style.animationDelay=(Math.random()*0.35)+"s";document.body.appendChild(s);setTimeout(function(){s.remove();},1700);})(i);}}

/* 음성 */
let VOICES=[],enVoice=null;
function loadVoices(){VOICES=speechSynthesis.getVoices();enVoice=VOICES.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Natural|Samantha|Aria/i.test(v.name))||VOICES.find(v=>/en[-_]US/i.test(v.lang))||VOICES.find(v=>/^en/i.test(v.lang))||null;}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;setInterval(()=>{if(speechSynthesis.paused)speechSynthesis.resume();},4000);}

/* GAS */
async function gas(action,payload){
  if(!GAS_URL)return null;
  try{const r=await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action},payload||{}))});const j=await r.json();return j.success?j.data:null;}catch(e){return null;}
}
function gasRead(action,payload){
  return new Promise(function(resolve){
    if(!GAS_URL){resolve(null);return;}
    var nm="__jp_"+Date.now()+"_"+Math.floor(Math.random()*99999);
    var p=payload?("&p="+encodeURIComponent(JSON.stringify(payload))):"";
    var url=GAS_URL+(GAS_URL.indexOf("?")>-1?"&":"?")+"action="+encodeURIComponent(action)+p+"&callback="+nm;
    var sc=document.createElement("script");var done=false;
    function clean(){try{delete window[nm];}catch(e){window[nm]=undefined;}if(sc&&sc.parentNode)sc.parentNode.removeChild(sc);}
    window[nm]=function(j){if(done)return;done=true;clean();resolve(j&&j.success?j.data:null);};
    sc.onerror=function(){if(done)return;done=true;clean();resolve(null);};
    sc.src=url;document.head.appendChild(sc);
    setTimeout(function(){if(!done){done=true;clean();resolve(null);}},12000);
  });
}
function nowStr(){return new Date().toLocaleString('ko-KR');}
